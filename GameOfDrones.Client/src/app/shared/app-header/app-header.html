<header class="app-header">
  <a class="app-header__brand" routerLink="/" [attr.aria-label]="i18n.t('header.home')">
    <span class="app-header__mark" aria-hidden="true"></span>
    {{ i18n.t('app.name') }}
  </a>

  <div class="app-header__controls">
    <div class="segmented" role="group" [attr.aria-label]="i18n.t('header.language')">
      @for (language of languages; track language) {
        <button
          type="button"
          class="segmented__option"
          [attr.aria-pressed]="i18n.language() === language"
          [attr.lang]="language"
          (click)="i18n.language.set(language)"
        >
          {{ language.toUpperCase() }}
        </button>
      }
    </div>

    <div class="segmented" role="group" [attr.aria-label]="i18n.t('header.theme')">
      @for (theme of themes; track theme) {
        <button
          type="button"
          class="segmented__option segmented__option--icon"
          [attr.aria-pressed]="themePreference.theme() === theme"
          [attr.aria-label]="i18n.t(themeLabels[theme])"
          [title]="i18n.t(themeLabels[theme])"
          (click)="themePreference.theme.set(theme)"
        >
          <svg class="icon" viewBox="0 0 24 24" aria-hidden="true">
            @switch (theme) {
              @case ('light') {
                <circle cx="12" cy="12" r="4" />
                <path
                  d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"
                />
              }
              @case ('dark') {
                <path d="M20 14.5A8 8 0 1 1 9.5 4a6.5 6.5 0 0 0 10.5 10.5Z" />
              }
              @default {
                <circle cx="12" cy="12" r="8" />
                <path d="M12 4a8 8 0 0 1 0 16Z" class="fill" />
              }
            }
          </svg>
        </button>
      }
    </div>
  </div>
</header>
